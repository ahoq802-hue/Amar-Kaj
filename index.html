<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amar Kaj</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--pr:#4f46e5;--bl:#2563eb;--blb:#dbeafe;--rd:#dc2626;--rdb:#fee2e2;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--tx:#eef0f5;--mu:#9aa3b2;--pr:#818cf8;--bl:#60a5fa;--blb:#1e3a5f;--rd:#f87171;--rdb:#4a1d1d;--bd:#2a3140;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10131a;--card:#1a1f2b;--tx:#eef0f5;--mu:#9aa3b2;--pr:#818cf8;--bl:#60a5fa;--blb:#1e3a5f;--rd:#f87171;--rdb:#4a1d1d;--bd:#2a3140;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;max-width:560px;padding:16px}
.hd{display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:4px 0}.sub{color:var(--mu);font-size:14px;margin-bottom:12px}
#lang{padding:6px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;font:inherit;font-weight:600}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.add{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;display:grid;gap:8px}
input,select{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);width:100%}
.row{display:flex;gap:8px}
.btn{padding:11px;border:0;border-radius:10px;font:inherit;font-weight:600;color:#fff;background:var(--pr)}
.task{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px}
.task.yes{background:var(--blb);border-color:var(--bl)}
.task.no{background:var(--rdb);border-color:var(--rd)}
.task.yes .t{color:var(--bl)}.task.no .t{color:var(--rd)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.t{font-weight:600;word-break:break-word}.tm{color:var(--mu);font-size:13px;white-space:nowrap}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--mu);margin-top:6px}
.act{display:flex;gap:8px;margin-top:10px}
.act button{flex:1;padding:10px;border-radius:10px;border:2px solid;background:transparent;font:inherit;font-weight:600}
.y{color:var(--bl);border-color:var(--bl)!important}.n{color:var(--rd);border-color:var(--rd)!important}
.y.sel{background:var(--bl);color:#fff}.n.sel{background:var(--rd);color:#fff}
.msg{font-size:13px;margin-top:8px;color:var(--mu)}
.del{background:none;border:0;color:var(--mu);font-size:18px}
.empty{text-align:center;color:var(--mu);padding:30px 0}
#alert{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));max-width:536px;margin:auto;background:var(--pr);color:#fff;border-radius:14px;padding:14px;display:none;z-index:9}
#alert button{margin-top:8px;padding:8px 14px;border:0;border-radius:8px;font:inherit;font-weight:600}
</style></head><body>
<div id="alert"></div>
<div class="hd"><h1 id="h1"></h1><button id="lang" onclick="toggleLang()"></button></div>
<div class="sub" id="dt"></div>
<div class="add">
  <input id="txt">
  <div class="row"><input id="tm" type="time"><select id="when"></select></div>
  <button class="btn" id="addb" onclick="addTask()"></button>
</div>
<div class="tabs"><button id="t0" class="on" onclick="tab(0)"></button><button id="t1" onclick="tab(1)"></button></div>
<div id="list"></div>
<script>
var S={bn:{title:'📝 আমার কাজ',ph:'কাজ লিখুন...',t0:'আজকে',t1:'কালকে',w0:'আজকের জন্য',w1:'কালকের জন্য',add:'+ কাজ যোগ করুন',yes:'✔ হ্যাঁ, হয়েছে',no:'✖ না',
 date:'আজকের তারিখ: ',empty:'কোনো কাজ নেই',carry:'আগের দিনের বাকি কাজ',myes:'✔ হয়েছে — কালকের তালিকায় আসবে না। ভুল হলে "না" চাপুন।',
 mno:'✖ হয়নি — আজ ও কাল, দুই জায়গাতেই থাকবে। ভুল হলে "হ্যাঁ" চাপুন।',mcar:'আজ না করলে কাজটা কালকেও থাকবে।',del:'কাজটি মুছবেন?',rem:'⏰ রিমাইন্ডার',ok:'ঠিক আছে',loc:'bn-BD',nt:'সময়: '},
 en:{title:'📝 My Tasks',ph:'Write a task...',t0:'Today',t1:'Tomorrow',w0:'For today',w1:'For tomorrow',add:'+ Add task',yes:'✔ Yes, done',no:'✖ No',
 date:'Today: ',empty:'No tasks',carry:'Pending from earlier',myes:'✔ Done — won\'t show tomorrow. Tap "No" if mistaken.',
 mno:'✖ Not done — stays in today and tomorrow. Tap "Yes" if mistaken.',mcar:'If not done today, this will stay tomorrow too.',del:'Delete this task?',rem:'⏰ Reminder',ok:'OK',loc:'en-US',nt:'Time: '}};
var KEY='kaj_v2',tasks=[],fired={},cur=0,lang='bn';
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'{}');tasks=d.tasks||[];fired=d.fired||{};lang=d.lang||'bn'}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({tasks:tasks,fired:fired,lang:lang}))}catch(e){}sched()}
function L(k){return S[lang][k]}
function fmt(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(x<10?'0':'')+x}
function today(){return fmt(new Date())}
function addDays(s,n){var p=s.split('-');return fmt(new Date(+p[0],+p[1]-1,+p[2]+n))}
function nowHM(){var d=new Date();return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toggleLang(){lang=lang=='bn'?'en':'bn';save();ui()}
function ui(){
 document.documentElement.lang=lang;
 document.getElementById('h1').textContent=L('title');
 document.getElementById('lang').textContent=lang=='bn'?'English':'বাংলা';
 document.getElementById('txt').placeholder=L('ph');
 document.getElementById('addb').textContent=L('add');
 document.getElementById('t0').textContent=L('t0');document.getElementById('t1').textContent=L('t1');
 var w=document.getElementById('when'),v=w.value||'0';
 w.innerHTML='<option value="0">'+L('w0')+'</option><option value="1">'+L('w1')+'</option>';w.value=v;
 render()}
function addTask(){var t=document.getElementById('txt').value.trim();if(!t)return;
 var w=+document.getElementById('when').value;
 tasks.push({id:Date.now(),text:t,time:document.getElementById('tm').value||'',dates:[addDays(today(),w)],res:{}});
 document.getElementById('txt').value='';save();tab(w)}
function mark(id,d,v){var k=tasks.find(function(x){return x.id==id});if(!k)return;
 k.res[d]=v;k.dates=k.dates.filter(function(x){return x<=d});
 if(v=='no'){var n=addDays(d,1);if(k.dates.indexOf(n)<0)k.dates.push(n)}
 save();render()}
function del(id){if(confirm(L('del'))){tasks=tasks.filter(function(x){return x.id!=id});save();render()}}
function tab(n){cur=n;document.getElementById('t0').className=n==0?'on':'';document.getElementById('t1').className=n==1?'on':'';render()}
function render(){
 var T=today(),D=addDays(T,cur);
 document.getElementById('dt').textContent=L('date')+new Date().toLocaleDateString(L('loc'),{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 var Ls=tasks.filter(function(k){return k.dates.indexOf(D)>=0}).sort(function(a,b){return (a.time||'99').localeCompare(b.time||'99')});
 var h=Ls.length?'':'<div class="empty">'+L('empty')+'</div>';
 Ls.forEach(function(k){
  var r=k.res[D],carried=k.dates.some(function(x){return x<D}),msg='',cls='';
  if(cur==0){if(r=='yes'){cls=' yes';msg=L('myes')}if(r=='no'){cls=' no';msg=L('mno')}}
  else if(carried)msg=L('mcar');
  h+='<div class="task'+cls+'"><div class="top"><div><div class="t">'+esc(k.text)+'</div>'+(carried&&cur==0?'<span class="tag">'+L('carry')+'</span>':'')+'</div><div style="text-align:right"><div class="tm">'+(k.time?'⏰ '+k.time:'')+'</div><button class="del" onclick="del('+k.id+')">🗑</button></div></div>';
  if(cur==0)h+='<div class="act"><button class="y'+(r=='yes'?' sel':'')+'" onclick="mark('+k.id+',\''+D+'\',\'yes\')">'+L('yes')+'</button><button class="n'+(r=='no'?' sel':'')+'" onclick="mark('+k.id+',\''+D+'\',\'no\')">'+L('no')+'</button></div>';
  if(msg)h+='<div class="msg">'+msg+'</div>';
  h+='</div>'});
 document.getElementById('list').innerHTML=h}
/* Native alarms (work when the app is closed) via Capacitor Local Notifications */
function LN(){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications}
async function sched(){var p=LN();if(!p)return;
 try{var pend=await p.getPending();if(pend.notifications.length)await p.cancel({notifications:pend.notifications});
  var items=[],id=1,now=Date.now();
  tasks.forEach(function(k){if(!k.time)return;k.dates.forEach(function(d){
   if(k.res[d])return;var a=d.split('-'),b=k.time.split(':'),at=new Date(+a[0],+a[1]-1,+a[2],+b[0],+b[1]);
   if(at.getTime()>now&&id<400)items.push({id:id++,title:L('rem'),body:k.text+' ('+k.time+')',schedule:{at:at,allowWhileIdle:true}})})});
  if(items.length)await p.schedule({notifications:items})}catch(e){}}
async function perm(){var p=LN();if(!p)return;try{await p.requestPermissions()}catch(e){}}
/* In-app fallback while the app is open (also for browser preview) */
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),i=0;(function b(){if(i++>3)return;var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.2;o.start();setTimeout(function(){o.stop();setTimeout(b,200)},250)})()}catch(e){}
 try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function check(){
 if(LN())return;
 var T=today(),N=nowHM(),hit=[];
 tasks.forEach(function(k){if(!k.time||k.dates.indexOf(T)<0||k.res[T])return;var key=k.id+'_'+T;
  if(k.time<=N&&!fired[key]){fired[key]=1;hit.push(k)}});
 if(hit.length){save();var a=document.getElementById('alert');
  a.innerHTML='<b>'+L('rem')+'</b><br>'+hit.map(function(k){return esc(k.text)+' ('+k.time+')'}).join('<br>')+'<br><button onclick="this.parentNode.style.display=\'none\'">'+L('ok')+'</button>';
  a.style.display='block';beep()}
 if(today()!=window._last){window._last=today();render()}}
load();window._last=today();ui();tab(0);perm();sched();check();setInterval(check,10000);
document.addEventListener('visibilitychange',function(){if(!document.hidden){check();render()}});
</script></body></html>
